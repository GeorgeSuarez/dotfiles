# ============================================
# COPY MODE
# ============================================

# Use vi keys
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"  # macOS
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"  # Linux

# ============================================
# PLUGINS (via TPM)
# ============================================

# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'fabioluciano/tmux-powerline'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'

# tmux-themepack settings
#set -g @themepack 'powerline/default/cyan'

# tmux-powerline settings
set -g @powerkit_status_position 'bottom'
set -g @powerkit_status_interval '5'
set -g @powerkit_elements_spacing "both"
set -g @powerkit_separator_style 'rounded'
# set -g @powerkit_theme 'tokyo-night'
# set -g @powerkit_theme_variant 'night'
set -g @theme_variation 'night'
set -g @powerkit_plugins 'git,cpu,memory,battery,datetime,hostname'

# tmux-powerkit plugin settings
set -g @powerkit_plugin_datetime_format "%m/%d/%Y %I:%M:%S"
set -g @powerkit_plugin_git_show_branch "true"
set -g @powerkit_plugin_git_show_files "true"

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
