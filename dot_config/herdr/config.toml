# herdr configuration
onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[terminal]
default_shell = "zsh"

[update]
channel = "stable"

[keys]
prefix = "ctrl+a"

# Prefix-mode actions
split_vertical = "prefix+backslash"
split_horizontal = "prefix+enter"

# Plannator keybinds
# Terminal annotations
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review (plannotator-tui)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[ui]
confirm_close = false
show_agent_labels_on_pane_borders = true
status_indicators = "dots"
agent_panel_sort = "priority"

[ui.toast]
# off = disable pop-up notifications
# herdr = show in-app toasts
# terminal = ask the outer terminal to show a desktop notification
# system = ask the OS notification service directly
# delivery = "off"
# delay_seconds = 1
delivery = "terminal"

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
# enabled = true
# position = "bottom-center"

[experimental]
kitty_graphics = true
pane_history = false


